name: Source links

# Docs move. This runs weekly so a dead source link shows up as a red run, not as a wrong cell.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Check every source URL
        run: ruby scripts/check-data.rb --links
