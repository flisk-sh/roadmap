# Site-wide settings.
# publisher       Who hosts the site. Shown in the banner and footer.
# publisher_url   Link for the publisher.
# seeded          When and how the first dataset was written, so readers know what to double-check.
# views           The four top-level tabs, in order. The first one is also the home page.
#                 subtabs: families (one per _data/families.yml entry, plus "All") or tracks (journeys.yml).
publisher: Flisk
publisher_url: https://flisk.sh
seeded: "October 2026, with AI-assisted research"
views:
  - id: compass
    name: Compass
    title: The DevEx Compass
    blurb: Ergonomics runs west to east, production parity south to north. A public checklist places every dot.
    subtabs: families
  - id: radar
    name: Adoption Radar
    title: Adoption Radar
    blurb: Adopt, Trial, Assess or Hold, decided by release and maturity signals, with a link to the evidence.
    subtabs: families
  - id: lab
    name: Lab
    title: The DevEx Lab
    blurb: Every tool as an element. Hover a tile for its formula; pick a family to light it up.
    subtabs: families
  - id: journeys
    name: Journeys
    title: Journeys
    blurb: Seven levels from your first lockfile to platform architect. Pick a track.
    subtabs: tracks
