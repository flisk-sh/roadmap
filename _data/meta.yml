# Site-wide settings for the comparison.
#
# primary         The id (from tools.yml) of the tool this site is about. It is always the
#                 first column and gets the accent color.
# primary_cli     The command name of the primary tool, used by `scripts/check-data.rb --cli`.
#                 Defaults to the id.
# maintainer      Who maintains the page. Shown in the footer and on the About page.
# maintainer_url  Optional link for the maintainer's name.
# footer_note     Optional sentence added to the footer, for example what the primary tool does not do.
# about_note      Optional extra bullet on the About page.
# pick_default    Optional list of tool ids the Pick tools page starts with.
# checked         The date, and the primary tool's version, the commands were last checked against.
primary: acme
primary_cli: acme
maintainer: the Acme team
maintainer_url: https://example.com
footer_note: Acme is a made-up tool. This is sample data, so replace it with your own.
about_note: The sample tools here are fictional. Replace them in _data/.
pick_default: [rival-a, rival-b]
checked:
  date: "2026-01-01"
  version: "1.0.0"
