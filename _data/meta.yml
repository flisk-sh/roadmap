# Site-wide settings.
# publisher       Who hosts the site. Shown in the banner and footer.
# publisher_url   Link for the publisher.
# seeded          When and how the first dataset was written, so readers know what to double-check.
# views           The four top-level tabs, in order. The first one is also the home page.
#                 subtabs: families (one per _data/families.yml entry, plus "All") or tracks (journeys.yml).
publisher: Flisk
publisher_url: https://flisk.sh
seeded: "October 2026, with AI-assisted research"
views:
  - id: compass
    name: Compass
    title: The DevEx Compass
    blurb: "Left: hard to use. Right: easy. Bottom: starts 1 piece of your app on your laptop. Top: starts the whole app. A checklist puts every dot, not a person."
    subtabs: families
  - id: radar
    name: Adoption Radar
    title: Adoption Radar
    blurb: Adopt means use it. Trial means try it. Assess means watch it. Hold means avoid for now. Each tool links the proof.
    subtabs: families
  - id: lab
    name: Lab
    title: The DevEx Lab
    blurb: Every tool as an element, scaled to fill your screen. Hover a tile for its formula; pick a family to zoom in.
    subtabs: families
  - id: journeys
    name: Journeys
    title: Journeys
    blurb: Seven levels from your first lockfile to platform architect. Pick a track.
    subtabs: tracks
