# Site-wide settings.
# publisher       Who hosts the site. Shown in the banner and footer.
# publisher_url   Link for the publisher.
# seeded          When and how the first dataset was written, so readers know what to double-check.
# views           The four top-level tabs, in order. The first one is also the home page.
#                 subtabs: where the sub-tabs come from. families (_data/families.yml), tracks (journeys.yml),
#                 roles (the groups in roles.yml), skills (skill_categories.yml) or none.
#                 Every kind except tracks also gets an "All" sub-tab.
publisher: Flisk
publisher_url: https://flisk.sh
seeded: "October 2026, with AI-assisted research"
views:
  - id: compass
    name: Compass
    title: The DevEx Compass
    blurb: "Left: hard to use. Right: easy. Bottom: made for small, simple setups. Top: made for big, real systems. A checklist puts every dot, not a person."
    subtabs: families
  - id: radar
    name: Adoption Radar
    title: Adoption Radar
    blurb: Adopt means use it. Trial means try it. Assess means watch it. Hold means avoid for now. Each tool links the proof.
    subtabs: families
  - id: lab
    name: Lab
    title: The DevEx Lab
    blurb: Every tool as an element, scaled to fill your screen. Hover a tile for its formula; pick a family to zoom in.
    subtabs: families
  - id: journeys
    name: Journeys
    title: Journeys
    blurb: Seven levels from your first lockfile to platform architect. Pick a track.
    subtabs: tracks
  - id: roles
    name: Roles
    title: Roles
    blurb: "Pick a job. See the tools that job really uses: must have, every day, good to know."
    subtabs: roles
  - id: skills
    name: Skills
    title: Agent Skills
    blurb: "Free AI agent skills from GitHub, tested by a small, cheap model (Haiku). Further right means Haiku used it right more often."
    subtabs: skills
  - id: ask
    name: Ask
    title: Ask
    blurb: "Type what you want to compare, like yarn vs npm vs bun. You get the answer from this site's data, no AI needed."
    subtabs: none
