# The tabs, in display order. The first tab is the home page; the others live at /<id>/.
# Each tab has a data file at _data/compare/<id>.yml. No page file is needed: _plugins/tab_pages.rb
# builds the pages from this list.
#   name   Tab label.
#   title  Page heading.
#   blurb  One short line of scope, shown next to the heading. Keep it honest and under 100 characters.
#   tools  Columns, in order. The primary tool (meta.yml) is always first.
- id: overview
  name: Overview
  title: Acme next to the usual tools
  blurb: Sample data. Acme and its rivals do the same everyday jobs.
  tools: [acme, rival-a, rival-b]
- id: extras
  name: Extras
  title: Acme vs Rival C
  blurb: Rival C solves a nearby problem, so some cells are the closest match.
  tools: [acme, rival-c]
