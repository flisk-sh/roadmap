# --- Compose ----------------------------------------------------------------

- id: docker-compose
  name: Docker Compose
  sym: Dc
  cat: Compose
  tagline: Define and run multi-container apps from YAML
  url: https://docs.docker.com/compose/
  repo: docker/compose
  license: oss
  ring: adopt
  evidence: https://github.com/docker/compose/releases
  dx: [one-command, zero-config, docs, cross-platform, offline, agent-ready]
  parity: [containers, multi-service, networking, state, prod-artifacts, config-secrets]
  note: No Kubernetes semantics; Compose files drift from cluster manifests unless kept in sync.

- id: compose-watch
  name: Compose Watch
  sym: Cw
  cat: Compose
  tagline: File sync and rebuild-on-change for Docker Compose
  url: https://docs.docker.com/compose/how-tos/file-watch/
  repo: docker/compose
  license: oss
  ring: adopt
  evidence: https://github.com/docker/compose/releases
  dx: [one-command, fast-feedback, docs, cross-platform, offline]
  parity: [containers, multi-service, networking, state, prod-artifacts]
  note: Sync works only for paths in the build context; large trees and bind mounts can be slow on macOS.

- id: podman-compose
  name: Podman Compose
  sym: Pc
  cat: Compose
  tagline: Run Compose files with Podman
  url: https://github.com/containers/podman-compose
  repo: containers/podman-compose
  license: oss
  ring: trial
  evidence: https://github.com/containers/podman-compose/releases
  dx: [one-command, offline, light]
  parity: [containers, multi-service, networking, state, prod-artifacts]
  note: Covers less of the Compose spec than Docker Compose; podman compose can also call docker-compose.

- id: kompose
  name: Kompose
  sym: Km
  cat: Compose
  tagline: Convert Compose files to Kubernetes manifests
  url: https://kompose.io
  repo: kubernetes/kompose
  license: oss
  ring: adopt
  evidence: https://github.com/kubernetes/kompose/releases
  dx: [zero-config, docs, cross-platform, offline, light]
  parity: [containers, multi-service, k8s]
  note: Output is a starting point; generated manifests usually need hand edits for probes and storage.

