# Dev environments: reproducible shells, dev containers, cloud workspaces and local stacks.
# Rings follow the rule in _data/rubric.yml. Release dates checked in October 2026.

# --- Reproducible shells ---
- id: nix
  name: Nix
  sym: Ni
  cat: Reproducible shells
  tagline: Purely functional package manager and dev shells
  url: https://nixos.org
  repo: NixOS/nix
  license: oss
  ring: adopt
  evidence: https://github.com/NixOS/nix/tags
  dx: [cross-platform, offline]
  parity: [prod-artifacts]
  note: Steep learning curve; the Nix language and flakes take real time to learn.

- id: devenv
  name: devenv
  sym: Da
  cat: Reproducible shells
  tagline: Nix-based dev environments with services and processes
  url: https://devenv.sh
  repo: cachix/devenv
  license: oss
  ring: adopt
  evidence: https://github.com/cachix/devenv/releases
  dx: [one-command, docs, cross-platform, offline, agent-ready]
  parity: [containers, multi-service, state, prod-artifacts]
  note: Requires Nix underneath; first evaluation can be slow.

- id: devbox
  name: Devbox
  sym: Db
  cat: Reproducible shells
  tagline: Isolated shells from Nix packages without writing Nix
  url: https://www.jetify.com/devbox
  repo: jetify-com/devbox
  license: oss
  ring: trial
  evidence: https://github.com/jetify-com/devbox/releases
  dx: [one-command, zero-config, docs, cross-platform, offline]
  parity: [multi-service, state, prod-artifacts]
  note: Still 0.x; installs Nix for you, which is the source of most errors.

- id: flox
  name: Flox
  sym: Fx
  cat: Reproducible shells
  tagline: Nix-backed environments you can share and layer
  url: https://flox.dev
  repo: flox/flox
  license: oss
  ring: trial
  evidence: https://github.com/flox/flox/releases
  dx: [one-command, zero-config, docs, cross-platform, offline]
  parity: [multi-service, state, prod-artifacts]
  note: Sharing environments through FloxHub needs an account.

- id: direnv
  name: direnv
  sym: Di
  cat: Reproducible shells
  tagline: Loads and unloads env vars per directory
  url: https://direnv.net
  repo: direnv/direnv
  license: oss
  ring: adopt
  evidence: https://github.com/direnv/direnv/releases
  dx: [zero-config, docs, cross-platform, offline, light]
  parity: []
  note: Only manages environment variables; pair it with Nix, devenv or a version manager.

- id: distrobox
  name: Distrobox
  sym: Dx
  cat: Reproducible shells
  tagline: Any Linux distro in a container, integrated with the host
  url: https://distrobox.it
  repo: 89luca89/distrobox
  license: oss
  ring: trial
  evidence: https://github.com/89luca89/distrobox/releases
  dx: [one-command, docs, offline, light]
  parity: [containers]
  note: Linux only. Shares your home directory, so it is not an isolation boundary. Last release April 2026.

- id: toolbx
  name: Toolbx
  sym: Tb
  cat: Reproducible shells
  tagline: Container-based mutable shells for Fedora and RHEL
  url: https://containertoolbx.org
  repo: containers/toolbox
  license: oss
  ring: trial
  evidence: https://github.com/containers/toolbox/releases
  dx: [one-command, offline, light]
  parity: [containers]
  note: Linux only and best supported on Fedora; still 0.x, last release September 2025.

