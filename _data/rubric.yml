# How a tool's Compass position and Radar ring are decided. Nobody places a dot by hand:
# a tool's X is 10 points per `dx` criterion it meets, its Y is 10 points per `parity` criterion
# (shown to people as "Starts whole app?": how much of your app it starts on your laptop).
# To move a dot, open a PR that adds or removes a criterion id on the tool, with a source.

dx:
  title: Easy to use?
  short: Easy to use
  low: Hard to use
  high: Easy to use
  explain: "Is the tool easy for you, every day? Each check is 10 points. More checks: more to the right."
  criteria:
    - id: one-command
      label: One command starts it
      help: A single command brings up the whole thing it manages.
    - id: zero-config
      label: Little setup
      help: Useful out of the box, or with a short generated config.
    - id: fast-feedback
      label: See changes fast
      help: Live reload, file sync or incremental rebuilds in seconds.
    - id: clear-errors
      label: Clear errors
      help: Says what broke and how to fix it, or ships a doctor-style check.
    - id: ui
      label: Has a screen to look at
      help: A web dashboard, TUI or desktop app, not only raw logs.
    - id: docs
      label: Working in 10 minutes
      help: Official docs get a newcomer to a working result in about ten minutes.
    - id: cross-platform
      label: Mac, Linux and Windows
      help: Supported on all three, natively or through WSL.
    - id: offline
      label: No account needed
      help: Runs on your machine without signing up or a network round trip.
    - id: light
      label: Light and fast
      help: Starts in seconds and does not need a large VM or many GB of RAM.
    - id: agent-ready
      label: AI can drive it
      help: An MCP server, a JSON output mode or an API an AI agent can drive.

# The data key stays `parity`; people read it as "Starts whole app?".
parity:
  title: Starts your whole app on your laptop?
  short: Starts whole app
  low: Starts 1 piece
  high: Starts whole app
  explain: "Your app is many pieces: website, API, database, queue. How many does this tool start on your laptop? Only 1 piece: bottom. All pieces, talking to each other: top. Each check is 10 points."
  criteria:
    - id: containers
      label: Starts containers
      help: Runs or builds OCI containers.
    - id: multi-service
      label: Starts many pieces
      help: Brings up and coordinates several services together.
    - id: networking
      label: Pieces talk to each other
      help: Service-to-service networking, DNS or ingress like production.
    - id: state
      label: Starts real database
      help: Databases, queues or volumes, not only in-memory fakes.
    - id: prod-artifacts
      label: Same images as live servers
      help: Uses the images, bundles or lockfiles that production uses.
    - id: k8s
      label: Speaks Kubernetes
      help: Manifests, pods, Helm charts or a real Kubernetes API.
    - id: cloud-apis
      label: Fakes or reaches the cloud
      help: Emulates or reaches real cloud provider APIs.
    - id: config-secrets
      label: Real config and secrets
      help: Environment, config and secrets handled the way production handles them.
    - id: observability
      label: Logs, metrics, traces
      help: Exposes telemetry the way production does.
    - id: team-scale
      label: Works for big teams
      help: Built for many services and many developers sharing a setup.

rings:
  - id: adopt
    label: Adopt
    help: Use it. Stable, updated in the last 6 months, lots of people use it.
  - id: trial
    label: Trial
    help: Try it. Still young (before 1.0), or quiet for 6 to 18 months, or few users yet.
  - id: assess
    label: Assess
    help: Watch it. Brand new, less than a year old.
  - id: hold
    label: Hold
    help: Avoid for now. Dead, deprecated, or no update in 18 months.

licenses:
  oss: Open source
  free: Free, closed source
  freemium: Free tier, paid plans
  paid: Paid
