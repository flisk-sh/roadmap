# Commands for the extras tab. Tool columns come from tabs.yml.
tasks:
  - id: deploy
    task: Deploy to production
    keywords: release ship publish
    cells:
      acme:
        status: none
        note: Acme is local only.
        source: https://example.com/#acme-commands
      rival-c:
        cmd: rival-c deploy
        source: https://example.com/#rival-c-deploy
  - id: check
    task: Check the config
    keywords: validate lint verify
    cells:
      acme:
        cmd: acme config verify
        source: https://example.com/#acme-config
      rival-c:
        cmd: rival-c validate
        source: https://example.com/#rival-c-validate
