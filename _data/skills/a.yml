# Skills catalog, part A: anthropics/skills, obra/superpowers, garrytan/gstack, mattpocock/skills, odykyi/gh-skills.
# Allowed `cat` ids come from _data/skill_categories.yml.

# ---------------------------------------------------------------- anthropics/skills
- id: anthropics-claude-api
  name: claude-api
  source: anthropics/skills
  path: skills/claude-api/SKILL.md
  cat: data
  what: "Gives the agent up-to-date facts to build apps on the Claude API: models, streaming, tools, caching."
  license: Apache-2.0
  eval:
    should:
      - "add streaming responses from Claude to my Node chat endpoint"
      - "my app calls an old claude model id, move it to the newest one and keep prompt caching working"
    near: "explain how transformers work in general"
    first_step: "Detect the project language, then read the matching language docs before writing any API code."

- id: anthropics-doc-coauthoring
  name: doc-coauthoring
  source: anthropics/skills
  path: skills/doc-coauthoring/SKILL.md
  cat: docs
  what: "Write a spec, RFC or design doc in three steps: gather context, shape it, test it on a fresh reader."
  license: unknown
  eval:
    should:
      - "help me write a design doc for moving our jobs to a queue"
      - "draft an RFC for the new auth flow, I have scattered notes"
    near: "fix the typo in the README"
    first_step: "Offer the structured workflow, then start Stage 1 by asking for the doc type, audience and desired impact."

- id: anthropics-frontend-design
  name: frontend-design
  source: anthropics/skills
  path: skills/frontend-design/SKILL.md
  cat: frontend
  what: "Build UI with a clear look of its own: pick a direction, type and palette, avoid template defaults."
  license: Apache-2.0
  eval:
    should:
      - "build a landing page for my CLI tool, it should not look like every other AI site"
      - "restyle this dashboard component, it looks generic"
    near: "fix the null pointer in the header component"
    first_step: "Name the product, audience and main job of the design before choosing any visual direction."

- id: anthropics-mcp-builder
  name: mcp-builder
  source: anthropics/skills
  path: skills/mcp-builder/SKILL.md
  cat: data
  what: "Build a good MCP server (Python or TypeScript) so an LLM can use an outside API through well-made tools."
  license: Apache-2.0
  eval:
    should:
      - "wrap our internal tickets API as an MCP server in TypeScript"
      - "I need an MCP server so Claude can query our Postgres read replica"
    near: "what is MCP and why do people like it"
    first_step: "Research and plan first: study the MCP protocol docs and the target API before writing server code."

- id: anthropics-skill-creator
  name: skill-creator
  source: anthropics/skills
  path: skills/skill-creator/SKILL.md
  cat: meta
  what: "Make a new skill, test it with sample prompts, and tune its description so it fires at the right time."
  license: Apache-2.0
  eval:
    should:
      - "turn my release checklist into a skill and check that it triggers"
      - "my skill never fires, help me improve its description with evals"
    near: "write a bash script that renames files"
    first_step: "Decide what the skill should do and roughly how, then draft it and write a few test prompts."

- id: anthropics-web-artifacts-builder
  name: web-artifacts-builder
  source: anthropics/skills
  path: skills/web-artifacts-builder/SKILL.md
  cat: frontend
  what: "Build a bigger React + Tailwind + shadcn artifact and bundle it into one HTML file."
  license: Apache-2.0
  eval:
    should:
      - "make a multi-page artifact with routing and shadcn components for tracking my expenses"
      - "build a React artifact with state management, then bundle it as a single html file"
    near: "write one simple html page with a button"
    first_step: "Run scripts/init-artifact.sh to initialise the frontend project."

- id: anthropics-webapp-testing
  name: webapp-testing
  source: anthropics/skills
  path: skills/webapp-testing/SKILL.md
  cat: test
  what: "Drive a local web app with Playwright scripts: check flows, take screenshots, read browser logs."
  license: Apache-2.0
  eval:
    should:
      - "start my dev server and check that the login form actually submits"
      - "take screenshots of the settings page and tell me if the console shows errors"
    near: "write jest unit tests for this pure function"
    first_step: "Run the helper script with --help first, then use it to manage the server and run Playwright."

# ---------------------------------------------------------------- obra/superpowers
- id: superpowers-brainstorming
  name: brainstorming
  source: obra/superpowers
  path: skills/brainstorming/SKILL.md
  cat: plan
  what: "Find out what you really want before building: ask, compare approaches, write and approve a design doc."
  license: MIT
  eval:
    should:
      - "I want to add team accounts to the app, where do we start"
      - "let's build a webhook retry system"
    near: "rename this variable to userId"
    first_step: "Ask yourself what you know about what they want and why, before replying; read referenced context first."

- id: superpowers-diagnosing-superpowers
  name: diagnosing-superpowers
  source: obra/superpowers
  path: skills/diagnosing-superpowers/SKILL.md
  cat: meta
  what: "Read the session transcripts to show why an agent session went wrong, with file and line proof."
  license: MIT
  eval:
    should:
      - "that last session took forever and redid work, find out why from the logs"
      - "a skill did not fire in yesterday's session, build a bug report for the maintainers"
    near: "why is my React app re-rendering too much"
    first_step: "Ask one question at a time until you can write a problem statement naming the session and the observable."

- id: superpowers-dispatching-parallel-agents
  name: dispatching-parallel-agents
  source: obra/superpowers
  path: skills/dispatching-parallel-agents/SKILL.md
  cat: meta
  what: "Give each independent problem to its own sub-agent and run them side by side."
  license: MIT
  eval:
    should:
      - "five test files fail for different reasons, can you chase them all at once"
      - "three modules are broken independently, split the investigation"
    near: "one failing test caused by a shared config change"
    first_step: "Group the failures by problem domain and check that the domains are independent."

- id: superpowers-executing-plans
  name: executing-plans
  source: obra/superpowers
  path: skills/executing-plans/SKILL.md
  cat: code
  what: "Carry out a written plan yourself, task by task, with test proof and a ledger, then one final review."
  license: MIT
  eval:
    should:
      - "here is the plan in docs/plans, run it inline, no subagents"
      - "implement this 8-step plan in this session and keep a record of decisions"
    near: "write me an implementation plan"
    first_step: "Take the first task, read its brief, and work its steps in order using TDD and recording a ledger."

- id: superpowers-finishing-a-development-branch
  name: finishing-a-development-branch
  source: obra/superpowers
  path: skills/finishing-a-development-branch/SKILL.md
  cat: git
  what: "When work is done and green, pick merge, PR or discard, then clean up the branch and worktree."
  license: MIT
  eval:
    should:
      - "feature is done and tests pass, what do I do with this branch"
      - "wrap up this worktree branch, I want to open a PR or merge it"
    near: "create a new branch for the next ticket"
    first_step: "Run the project's full test suite and stop if anything fails before showing any options."

- id: superpowers-receiving-code-review
  name: receiving-code-review
  source: obra/superpowers
  path: skills/receiving-code-review/SKILL.md
  cat: review
  what: "Handle review comments with checks, not blind yes: understand, verify, then fix or push back."
