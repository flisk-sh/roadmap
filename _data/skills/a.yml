      - "I have a plan with mostly independent tasks, drive it to done with reviews"
    near: "run this plan yourself without subagents"
    first_step: "Read the plan, then dispatch a fresh implementer sub-agent for the first task."

- id: superpowers-systematic-debugging
  name: systematic-debugging
  source: obra/superpowers
  path: skills/systematic-debugging/SKILL.md
  cat: debug
  what: "Find the root cause before any fix, in four phases: investigate, compare, hypothesise, then fix."
