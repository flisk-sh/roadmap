  eval:
    should:
      - "checkout randomly returns 500 in prod, figure out why"
      - "the CI test is flaky and my last two fixes did nothing"
    near: "add a new endpoint for exporting users"
    first_step: "Read the error messages and stack traces carefully and reproduce the bug before proposing any fix."

- id: superpowers-test-driven-development
  name: test-driven-development
  source: obra/superpowers
  path: skills/test-driven-development/SKILL.md
