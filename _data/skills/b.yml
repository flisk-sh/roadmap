# Skills catalog, batch b: vendor and official repos (Vercel, Trail of Bits, Sentry, HashiCorp, Cloudflare, ...).
# Every entry was written after reading the skill's own SKILL.md.

# ---------- vercel-labs/agent-skills ----------
- id: vercel-react-best-practices
  name: vercel-react-best-practices
  source: vercel-labs/agent-skills
  path: skills/react-best-practices/SKILL.md
  cat: frontend
  what: 70 rules from Vercel to make React and Next.js apps fast. Fixes waterfalls and big bundles.
  license: MIT
  eval:
    should:
      - "My Next.js dashboard loads slow and the bundle is huge. Can you go through the components and fix what hurts speed?"
      - "Review this page component, I think we fetch data one after another instead of in parallel."
    near: "Our Express API has slow SQL queries. Help me tune the indexes."
    first_step: Read the rule categories by priority, starting with eliminating async waterfalls and bundle size.

- id: vercel-composition-patterns
  name: vercel-composition-patterns
  source: vercel-labs/agent-skills
  path: skills/composition-patterns/SKILL.md
  cat: frontend
  what: Fix React components that have too many boolean props. Use compound components and context instead.
  license: MIT
  eval:
    should:
      - "My Button component has 12 boolean props now and nobody can read it. How do I restructure it?"
      - "I'm building a reusable Modal for our component library, make the API flexible with sub-components."
    near: "Make this React page load faster by lazy loading the heavy imports."
    first_step: Check the component for boolean prop proliferation, then pick a pattern like compound components or lifted state.

- id: vercel-react-view-transitions
  name: vercel-react-view-transitions
  source: vercel-labs/agent-skills
  path: skills/react-view-transitions/SKILL.md
  cat: frontend
  what: Add smooth page and element animations with the React View Transition API.
  license: MIT
  eval:
    should:
      - "Add a nice animation when the user clicks a card and goes to the detail page in our Next.js app."
      - "I want list items to animate when they reorder after sorting. Use the native browser transition stuff."
    near: "Add a spinner while the form is submitting."
    first_step: Go through the patterns in priority order (shared element, Suspense reveal, list identity) and add every one that fits.

- id: vercel-deploy-to-vercel
  name: deploy-to-vercel
  source: vercel-labs/agent-skills
  path: skills/deploy-to-vercel/SKILL.md
  cat: ops
  what: Deploy any project to Vercel as a preview, and get it linked for git-push deploys.
  license: unknown
  eval:
    should:
      - "Deploy this app and give me the link."
      - "Push this live on Vercel so I can show my client."
    near: "Deploy this container to our Kubernetes cluster."
    first_step: Run four checks - git remote, .vercel/project.json link, vercel whoami, and vercel teams list.

- id: vercel-vercel-cli-with-tokens
  name: vercel-cli-with-tokens
  source: vercel-labs/agent-skills
  path: skills/vercel-cli-with-tokens/SKILL.md
  cat: ops
  what: Use the Vercel CLI with an access token instead of interactive login. Good for agents and CI.
  license: unknown
  eval:
    should:
      - "Set my env vars on Vercel from the terminal, I only have a token, I can't do vercel login here."
      - "Deploy this project with the Vercel CLI inside the sandbox using my VERCEL_TOKEN."
    near: "Walk me through creating a Vercel account in the browser."
    first_step: Find the Vercel token - check VERCEL_TOKEN in the environment first, then .env, then ask the user.

- id: vercel-vercel-optimize
  name: vercel-optimize
  source: vercel-labs/agent-skills
  path: skills/vercel-optimize/SKILL.md
  cat: ops
  what: Cut Vercel cost and speed problems. Starts from real metrics, then looks only at code that metrics flag.
  license: unknown
  eval:
    should:
      - "Our Vercel bill jumped this month. Find which routes cost the most and how to fix them."
      - "Audit my deployed Next.js project for performance using the Vercel usage data."
    near: "Make my local dev server start faster."
    first_step: Collect Vercel metrics, usage and project config into signals.json before reading any source file.

- id: vercel-web-design-guidelines
  name: web-design-guidelines
  source: vercel-labs/agent-skills
  path: skills/web-design-guidelines/SKILL.md
  cat: frontend
  what: Check UI code against Vercel's Web Interface Guidelines. Reports file:line findings.
  license: unknown
  eval:
    should:
      - "Review my UI code for accessibility problems and UX mistakes."
      - "Audit src/components against web best practices before we ship."
    near: "Design a new landing page for me from scratch."
    first_step: Fetch the latest guidelines from the vercel-labs/web-interface-guidelines command.md URL before reviewing.

