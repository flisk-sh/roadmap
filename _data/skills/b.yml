      - "Do a supply chain audit of this Go and Python project before we go to production."
    near: "Bump all our dependencies to the latest versions."
    first_step: Run the deterministic collector script on the manifests and lockfile instead of estimating figures by hand.

- id: trailofbits-property-based-testing
