  license: CC-BY-SA-4.0
  eval:
    should:
      - "Do a security review of this PR before I merge. It touches the auth middleware."
      - "Check what these last three commits could break. Look at blast radius and test coverage."
    near: "Give me a style review of this PR, naming and formatting only."
    first_step: Classify the change by risk, not size, and build baseline context from git history before reading the diff.

- id: trailofbits-variant-analysis
