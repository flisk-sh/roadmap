    should:
      - "We just fixed an IDOR in the invoices endpoint. Where else do we have the same mistake?"
      - "Found an unchecked buffer length in parse_header. Search the repo for siblings of this bug."
    near: "Audit this repo for vulnerabilities from scratch."
    first_step: Extract the root cause (why the code is wrong) and list the directions a variant could hide in.

- id: trailofbits-supply-chain-risk-auditor
