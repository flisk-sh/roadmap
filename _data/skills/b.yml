      - "We keep calling eval on user input. Write a Semgrep rule to catch it everywhere."
      - "Make a taint-mode Semgrep rule that follows request params into our raw SQL calls."
    near: "Run the standard Semgrep rulesets on this repo and show me the findings."
    first_step: Write the rule plus a test file, then run semgrep --test to verify it before calling it done.

