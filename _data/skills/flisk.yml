      - "add a Svelte frontend to my shop stack"
      - "I want a Python FastAPI backend in my Flisk stack with pytest set up"
    near: "I already have a Dockerfile for a Ruby service, wire it into the stack"
    first_step: "List what this CLI version supports with flisk resource --type backend --frameworks and flisk resource --type frontend --frameworks."

- id: flisk-byo
  name: flisk-byo
  source: flisk-sh/flisk-skills
  path: skills/flisk-byo/SKILL.md
  cat: code
  what: "Wrap any existing Dockerfile, registry image or source tree in a Flisk stack as a bring-your-own resource, including one-shot jobs like migrations."
  license: MIT
  eval:
    should:
      - "I have a Dockerfile for a legacy service, run it in my Flisk stack"
      - "add redis:7-alpine to my stack and a migration job that exits when done"
    near: "import my root docker-compose.yml into flisk"
    first_step: "Register it with flisk resource legacy --type bring-your-own --stack shop --dockerfile ./Dockerfile --health-path /health --path services/shop/legacy --yes."

- id: flisk-contributing
  name: flisk-contributing
  source: flisk-sh/flisk-skills
  path: skills/flisk-contributing/SKILL.md
  cat: code
  what: "Contribute to the flisk CLI repo itself: nested AGENTS.md rules, rebuilding cli/dist, make test, skills sync and signed-off commits."
  license: MIT
