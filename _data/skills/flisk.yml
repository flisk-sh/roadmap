# Skills catalog: Flisk's own skills, from flisk-sh/flisk-skills (34) and flisk-sh/flisk .claude/skills (12).
# Allowed `cat` ids come from _data/skill_categories.yml.

# ---------------------------------------------------------------- flisk-sh/flisk-skills
- id: flisk-agents
  name: flisk-agents
  source: flisk-sh/flisk-skills
  path: skills/flisk-agents/SKILL.md
  cat: data
  what: "Build an AI agent in a local Flisk stack: agent plus MCP tools, database and queue, with durable sessions and its process contract."
  license: MIT
  eval:
    should:
      - "set up a local stack with my chat agent and an MCP tools server so I can test sessions"
      - "I want my agent's conversation state to survive restarts while I develop locally"
    near: "add a plain REST backend with a Postgres table to my stack"
    first_step: "Scaffold the agent and its tools with flisk resource bot --type agent --stack shop --yes, then flisk resource tools-mcp --type mcp --stack shop --yes."

- id: flisk-benchmark
  name: flisk-benchmark
  source: flisk-sh/flisk-skills
  path: skills/flisk-benchmark/SKILL.md
  cat: ops
  what: "Measure how many Flisk services fit on a machine: idle memory from the Docker VM, start time, image disk use and health."
  license: MIT
  eval:
    should:
      - "how many services can my 16 GB laptop run with flisk before it chokes?"
      - "measure idle memory per container for my stack, docker stats looks too low"
    near: "my flisk up takes forever, find the slow generator step"
    first_step: "Warn the user before starting dozens of containers and give an estimate, then run bun scripts/benchmark/container-scale.ts --synthetic --tiers 5,20,100."

- id: flisk-build-runtimes
  name: flisk-build-runtimes
