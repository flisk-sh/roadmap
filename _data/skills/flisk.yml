# Skills catalog: Flisk's own skills, from flisk-sh/flisk-skills (43) and flisk-sh/flisk .claude/skills (12).
# Allowed `cat` ids come from _data/skill_categories.yml.

# ---------------------------------------------------------------- flisk-sh/flisk-skills
- id: flisk-agents
  name: flisk-agents
  source: flisk-sh/flisk-skills
  path: skills/flisk-agents/SKILL.md
  cat: data
  what: "Run an AI agent, MCP tools server, database and queue in one local Flisk stack with sticky sessions."
  license: MIT
  eval:
    should:
      - "set up a local stack with my chat agent and an MCP tools server so I can test sessions"
      - "I want my agent's conversation state to survive restarts while I develop locally"
    near: "ship my finished agent to Fly.io"
    first_step: "Scaffold with flisk resource bot --type agent --stack shop --yes, then flisk resource tools-mcp --type mcp."

- id: flisk-ai-agent-build
  name: flisk-ai-agent-build
  source: flisk-sh/flisk-skills
  path: skills/flisk-ai-agent-build/SKILL.md
  cat: data
  what: "Same job as flisk-agents: scaffold agent plus MCP tools plus database in one stack. Near copy, shorter."
  license: MIT
  eval:
    should:
      - "start an agent app next to my backend with flisk, with an MCP server for its tools"
      - "scaffold the agent, the tools server and the stack in one go"
    near: "add a Python API with Postgres to my existing stack"
    first_step: "Run flisk resource bot --type agent --stack shop --yes, then add the mcp resource and flisk up shop."

